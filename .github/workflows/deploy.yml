name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/higgsfield-cli-setup-eeq6ss
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages (build type = GitHub Actions) if it isn't
          # already on, so no manual Settings toggle is required.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain static files at the repo root.
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
