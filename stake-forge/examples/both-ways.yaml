      cost: 1
      rtp: 0.965
      maxWin: 5000
      feature: true
      buyBonus: false
    bonus:
      cost: 100
      rtp: 0.965
      maxWin: 5000
      feature: false
      buyBonus: true
  multiplierStrategy: combined
  globalMultiplierPerSpin: true
paylines: default_20
