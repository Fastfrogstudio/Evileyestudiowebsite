# A WORKED EXAMPLE: a tiered bonus buy, where the tiers genuinely differ.
#
# Three bet modes, all optimised to 96.50% RTP — which is what Stake's
# "every mode within 0.5pp of base" rule requires. At $1 per base spin:
#
#   base spin     1x  =   $1   normal play
#   bonusLite    40x  =  $40   forced 3-scatter trigger -> 12 free spins
#   bonus       100x  = $100   forced 5-scatter trigger -> 16 free spins
#
# Measured, so the premium tier has a real reason to exist:
#
#              median    p99      max win reached
#   bonusLite  27.20x   160.6x    1 in 500,000
#   bonus      61.07x   535.6x    1 in 200,000
#
# The $100 tier pays 2.2x the median and 3.3x the p99, and reaches the cap 2.5x
# more often. WITHOUT forceScatters both tiers generate the SAME feature, which
# makes the cheaper one strictly the better deal and the menu pointless.
#
# forceScatters uses machinery that already exists: scatter_triggers sets how
# many scatters the forced trigger lands, freespin_triggers maps that count to a
# spin award. No new engine work and no second reel strip.
#
# chimera — a deliberate mechanic merge, to prove the tool can do it.
#
# Four mechanics, each popularised by a different studio's game, in one spec:
#
#   cluster pays + tumbling   Sweet Bonanza / Sugar Rush   (Pragmatic Play)
#   doubling grid multipliers Sugar Rush                   (Pragmatic Play)
#   expanding wilds           the "book" lineage           (Play'n GO / NetEnt)
#   climbing global multiplier Razor Shark                 (Push Gaming)
#
# None of these is copied from anyone. Each is the plain-language RULE, built
# from math-sdk primitives with our own art. The two that used to be refused —
# expanding wilds on a cascading board, and doubling grid multipliers — became
# generatable through the boardLifetime work and the gridMultipliers spec block.
