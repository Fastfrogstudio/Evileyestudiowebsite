# A WORKED EXAMPLE: sticky wilds that grow every spin.
#
# Scroll Keeper's rule. A wild locks to its cell for the rest of the free-spin
# round and its multiplier steps up every spin, to a cap. Wilds accumulate, so a
# round that starts rich gets richer.
#
# ── Three engine facts that decide whether this works ────────────────────────
#
# 1. Multipliers SUM, they do not multiply. apply_added_symbol_mult() in
#    src/wins/multiplier_strategy.py adds up the multipliers of the winning
#    positions, so two stuck wilds worth 3 and 5 on one line pay 8x, not 15x.
#    A wild sitting OFF the winning line pays nothing at all.
#
# 2. start must be at least 2. That same function ignores any multiplier that is
#    not GREATER than 1, so a ladder starting at 1 pays nothing on the spin a
#    wild lands, which reads as a bug to a player and to a tester.
#
# 3. The wild must be in special: [wild, multiplier]. json_ready_sym() only
#    serialises the symbol attributes named in special_symbols — without the
#    multiplier group the value is applied to the win but never reaches the
#    client, so the round pays more than the board can explain. forge refuses
#    the spec rather than letting that ship.
#
# ── What it costs, measured against the identical game with it switched off ──
#
#   raw RTP                     21.8x  ->  338.4x
#   after optimisation, BOTH:   96.50% RTP, 1-in-3.4 hit rate, 0.5% feature rate
#   mean free-game payout        34x -> 73x  (plain: weighted UP toward target)
#                             3,329x -> 73x  (sticky: weighted DOWN 45x)
#   richest free round the feature reaches on its own:  290x  ->  5,000x (cap)
#
# Nothing downstream fails — every math:validate rule passes on both. What moves
# is the weight INSIDE the feature: the optimiser holds RTP by leaning on the
# poorest sticky rounds, so the saturated boards the mechanic exists for are
# simulated and then rarely served. Run `forge math:balance` on this spec and it
# reports the saturation with the numbers for YOUR strips.
#
# The upside from the same run: this is the mechanic to reach for when max win
# should come out of the FEATURE rather than a forced wincap round.
#
# ── Try it ───────────────────────────────────────────────────────────────────
#   forge math:balance  --spec examples/sticky-wilds.yaml
#   forge math:scaffold --spec examples/sticky-wilds.yaml --math-sdk ../math-sdk
#   forge verify        --spec examples/sticky-wilds.yaml --math-sdk ../math-sdk

